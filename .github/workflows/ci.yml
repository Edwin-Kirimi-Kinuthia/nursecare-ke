name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Build must succeed without a live DB; queries run only at request time.
          DATABASE_URL: ""

  e2e:
    name: E2E (Playwright + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: carebora
          POSTGRES_PASSWORD: carebora
          POSTGRES_DB: carebora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carebora -d carebora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carebora:carebora@localhost:5432/carebora?schema=public
      JWT_SECRET: ci-test-secret-not-for-production-0123456789abcdef
      # No Daraja/Jenga sandbox creds are available in CI — Till mode lets
      # checkout flows (orders, lab orders, ambulance, home visits) run
      # end-to-end without calling a real payment gateway.
      PAYMENTS_MODE: till
      NEXT_PUBLIC_PAYMENTS_MODE: till
      NEXT_PUBLIC_MPESA_TILL_NUMBER: "174379"
      NEXT_PUBLIC_MPESA_TILL_NAME: CareBora (CI)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        # db:push only pushes the Prisma-visible schema — it skips the raw-SQL
        # migrations that create the PostGIS geog-sync triggers, which would
        # silently break every proximity query (storefront, ambulance dispatch).
        run: npm run db:deploy
      - name: Seed demo data
        run: npm run db:seed
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start server and run E2E
        working-directory: apps/web
        run: |
          npm run start &
          server_pid=$!
          echo "Waiting for server to become healthy…"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/v1/health >/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          npm run e2e
          kill "$server_pid" 2>/dev/null || true
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
