name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test migration deployment
        run: npm run test:migrations -w @carebora/db
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Build must succeed without a live DB; queries run only at request time.
          DATABASE_URL: ""

  e2e:
    name: E2E (Playwright + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: carebora
          POSTGRES_PASSWORD: carebora
          POSTGRES_DB: carebora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carebora -d carebora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carebora:carebora@localhost:5432/carebora?schema=public
      RESEND_API_KEY: re_local_ci_fake
      RESEND_API_BASE_URL: http://127.0.0.1:4319
      JWT_SECRET: ci-test-secret-not-for-production-0123456789abcdef
      PROVIDER_MEETINGS_E2E: "1"
      WHATSAPP_E2E: "1"
      # No access token: integrations exercise durable failure handling without
      # sending any real WhatsApp messages. Transport tests inject a fake fetch.
      WHATSAPP_ENABLED: "true"
      WHATSAPP_ADMIN_TO: "+254700000030"
      WHATSAPP_PHONE_NUMBER_ID: "123456789"
      WHATSAPP_APP_SECRET: ci-whatsapp-test-secret
      WHATSAPP_VERIFY_TOKEN: ci-whatsapp-verify-token
      ACCOUNT_LIFECYCLE_TEST_DATABASE_URL: postgresql://carebora:carebora@localhost:5432/carebora?schema=public
      LIVEKIT_API_KEY: ci-livekit-key
      LIVEKIT_API_SECRET: ci-livekit-secret-for-token-tests-only
      LIVEKIT_URL: ws://127.0.0.1:7999
      # No Daraja/Jenga sandbox creds are available in CI — Till mode lets
      # checkout flows (orders, lab orders, ambulance, home visits) run
      # end-to-end without calling a real payment gateway.
      PAYMENTS_MODE: till
      NEXT_PUBLIC_PAYMENTS_MODE: till
      NEXT_PUBLIC_MPESA_TILL_NUMBER: "174379"
      NEXT_PUBLIC_MPESA_TILL_NAME: CareBora (CI)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        # db:push only pushes the Prisma-visible schema — it skips the raw-SQL
        # migrations that create the PostGIS geog-sync triggers, which would
        # silently break every proximity query (storefront, ambulance dispatch).
        run: npm run db:deploy
      - name: Test B2C accounting and callbacks
        run: npm run test:b2c -w @carebora/core
      - name: Seed demo data
        run: npm run db:seed
      - name: Generate disposable browser push keys
        run: node -e 'const fs=require("fs"),k=require("web-push").generateVAPIDKeys(); fs.appendFileSync(process.env.GITHUB_ENV,`VAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_PRIVATE_KEY=${k.privateKey}\n`);'
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start server and run E2E
        working-directory: apps/web
        run: |
          node scripts/mock-email-server.mjs &
          email_server_pid=$!
          npm run start &
          server_pid=$!
          trap 'kill "$server_pid" "$email_server_pid" 2>/dev/null || true' EXIT
          echo "Waiting for server to become healthy…"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/v1/health >/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          npm run e2e
      - name: Test review invitations and marketplace ranking
        run: npx tsx --test packages/core/test/auth-recovery.integration.test.ts packages/core/test/review-invitations.integration.test.ts packages/core/test/service-feedback.integration.test.ts
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
