name: Desktop apps

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release containing the built installers
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Camera consent and sandbox smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:media
      - run: npm run build
        env:
          # Signing credentials can be added before the public release.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Checksums
        run: node scripts/checksums.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30
  draft:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          Care Bora desktop apps for Windows, macOS (Intel and Apple Silicon), and Linux.

          These initial packages are unsigned. macOS may block installation until Developer ID signing and notarization are configured. Windows may display an unrecognized-publisher warning.

          Internet is required. Sign in with email and your emailed code. Enable notifications from the Care Bora app menu. Closing an opted-in app keeps it in the system tray; Quit stops alerts.

          Review SHA256SUMS before installing. Device installation and consultation checks are required before publishing this draft.
          NOTES
          app_version=$(node -p "require('./apps/desktop/package.json').version")
          gh release create "desktop-v${app_version}-${GITHUB_RUN_NUMBER}" installers/* --draft --target "$GITHUB_SHA" --title "Care Bora desktop ${app_version}" --notes-file /tmp/release-notes.md
