# CareBora self-hosting stack: Postgres + the app + Caddy (auto HTTPS).
# Usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: carebora
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: carebora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebora"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    # All secrets (LiveKit, M-Pesa, HF, Resend, Africa's Talking, APP_URL,
    # MPESA_CALLBACK_URL, and DATABASE_URL) come from the .env file.
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
